name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='docs/' \
            --exclude='public/' \
            --exclude='README.md' \
            --exclude='testimonials backup.html' \
            ./ public/
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
